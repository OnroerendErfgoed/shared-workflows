name: Dependency-Track

# Reusable workflow: generates CycloneDX SBOMs of a project's backend (Python, uv) and optional
# frontends (Vue with Vite, Aurelia with webpack; pnpm, yarn or npm), uploads them to
# Dependency-Track and scores every finding with the OE risk formula:
#
#   Risicoscore = Impact x (CVSS weight + Exploitability + Exposure)
#   Impact = max(ICR B, I, C)   Laag-middel <= 20, Hoog 21-35, Kritiek >= 36
#
# Run it on pull requests (version: the PR's source branch) and on a schedule on main/master
# (version: the app version in pyproject.toml, marked latest). Both create or update one
# GitHub issue per vulnerable library, and fail the job when a finding reaches fail-level.
# Scheduled and manual runs also send that failure to Sentry when the caller passes sentry-dsn.
#
# No API key: the job exchanges its GitHub OIDC token for a short-lived Dependency-Track session
# (workload identity federation, Dependency-Track 5.2+); see the README for the server setup.
#
# Triggers stay in the calling workflow.
# The calling job must grant `contents: read`, `id-token: write`, `issues: write` and
# `packages: read`.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label, or a JSON list of labels (e.g. '["self-hosted", "linux"]').
        type: string
        default: self-hosted
      icr-b:
        description: ICR3.0 Beschikbaarheid (availability), 1-5.
        type: number
        required: true
      icr-i:
        description: ICR3.0 Integriteit (integrity), 1-5.
        type: number
        required: true
      icr-c:
        description: ICR3.0 Confidentialiteit (confidentiality), 1-5.
        type: number
        required: true
      exposure:
        description: 1 = internal and isolated, 2 = reachable internally, 3 = reachable from outside.
        type: number
        required: true
      epss-threshold:
        description: EPSS score from which a finding counts as exploited in the wild ("beperkte waarnemingen").
        type: string
        default: "0.1"
      fail-level:
        description: "Fail the job when a finding reaches this level: Kritiek, Hoog or none."
        type: string
        default: Kritiek
      ticket-level:
        description: "Create or update an issue per library with findings from this level: Kritiek, Hoog, Laag-middel or none."
        type: string
        default: Hoog
      ticket-labels:
        description: Comma-separated labels for the issues. The first one is used to find existing issues.
        type: string
        default: security,dependencies
      project-name:
        description: Parent project in Dependency-Track; the SBOMs go to <name>-backend and <name>-frontend. Defaults to the repository name.
        type: string
        default: ""
      project-version:
        description: Version in Dependency-Track. Defaults to the source branch on pull requests, the version in pyproject.toml on main/master, else the branch or tag name.
        type: string
        default: ""
      backend-directory:
        description: Directory holding pyproject.toml and uv.lock (or the requirements file).
        type: string
        default: .
      sbom-source:
        description: "Where the backend SBOM comes from: uv (uv.lock) or requirements (requirements-file)."
        type: string
        default: uv
      requirements-file:
        description: Pinned runtime requirements, relative to backend-directory, for sbom-source requirements.
        type: string
        default: requirements.txt
      frontend-directories:
        description: >-
          Frontend directories, separated by spaces, commas or newlines. Each holds package.json and
          pnpm-lock.yaml, yarn.lock or package-lock.json, and vite.config.* (Vue) or webpack.config.*
          (Aurelia). They go to Dependency-Track as one frontend project. Empty for no frontend.
        type: string
        default: ""
      frontend-scope:
        description: "bundle: only packages that reach the browser in a production build; lockfile: everything in the lockfiles."
        type: string
        default: bundle
      node-version:
        description: Node.js version for the frontends.
        type: string
        default: "22"
      github-packages:
        description: Install @OnroerendErfgoed frontend packages from GitHub Packages.
        type: boolean
        default: true
      server-hostname:
        description: Dependency-Track hostname. Falls back to the DEPENDENCY_TRACK_HOSTNAME variable, then to the test instance.
        type: string
        default: ""
      workload-identity-provider:
        description: Name of the workload identity provider in Dependency-Track.
        type: string
        default: github-actions
      service-account:
        description: Dependency-Track service account the job acts as.
        type: string
        default: github-ci
      timeout-minutes:
        type: number
        default: 30
    secrets:
      sentry-dsn:
        description: DSN of the Sentry project for the alerts. Without it, no alerts are sent.
        required: false
    outputs:
      max-risk:
        description: Highest Risicoscore of all findings (0 without findings).
        value: ${{ jobs.scan.outputs.max-risk }}
      max-level:
        description: Level of the highest finding (Kritiek, Hoog, Laag-middel or none).
        value: ${{ jobs.scan.outputs.max-level }}

permissions: {}

jobs:
  scan:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, exchanged for a Dependency-Track session
      issues: write # one issue per vulnerable library
      packages: read # @OnroerendErfgoed frontend packages on GitHub Packages
    outputs:
      max-risk: ${{ steps.score.outputs.max-risk }}
      max-level: ${{ steps.score.outputs.max-level }}

    defaults:
      run:
        shell: bash

    env:
      DT_URL: https://${{ inputs.server-hostname || vars.DEPENDENCY_TRACK_HOSTNAME || 'test-dependencytrack.onroerenderfgoed.be' }}
      PROJECT: ${{ inputs.project-name || github.event.repository.name }}
      FRONTEND_DIRS: ${{ inputs.frontend-directories }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # On main/master: the app version declared in pyproject.toml, marked latest. On a PR: the
      # source branch, so every push to the PR updates the same version. Elsewhere: the branch
      # or tag name.
      - name: Project version
        id: version
        working-directory: ${{ inputs.backend-directory }}
        env:
          VERSION: ${{ inputs.project-version }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          latest=false
          if [ -n "$HEAD_REF" ]; then
            VERSION="${VERSION:-$HEAD_REF}"
          elif [ "$REF_NAME" = main ] || [ "$REF_NAME" = master ]; then
            latest=true
            if [ -z "$VERSION" ] && [ -f pyproject.toml ]; then
              VERSION=$(uv run --no-project --quiet python -c '
          import tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))
          print(d.get("project", {}).get("version") or d.get("tool", {}).get("poetry", {}).get("version") or "")')
            fi
            if [ -z "$VERSION" ]; then
              echo "::warning::No version in pyproject.toml; using the branch name"
            fi
          fi
          VERSION="${VERSION:-$REF_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT $VERSION (latest: $latest)"

      - name: Backend SBOM
        working-directory: ${{ inputs.backend-directory }}
        env:
          SBOM_SOURCE: ${{ inputs.sbom-source }}
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
          BOM: ${{ runner.temp }}/backend.bom.json
        run: |
          case "$SBOM_SOURCE" in
            uv)
              if [ ! -f uv.lock ]; then
                echo "::error::No uv.lock in $PWD (set backend-directory, or sbom-source: requirements)"
                exit 1
              fi
              uv export --format cyclonedx1.5 --frozen --no-dev -o "$BOM"
              ;;
            requirements)
              if [ ! -f "$REQUIREMENTS_FILE" ]; then
                echo "::error::No $REQUIREMENTS_FILE in $PWD (set backend-directory or requirements-file)"
                exit 1
              fi
              uvx --from cyclonedx-bom==7.5.0 cyclonedx-py requirements "$REQUIREMENTS_FILE" --of JSON -o "$BOM"
              ;;
            *)
              echo "::error::Unknown sbom-source '$SBOM_SOURCE' (expected uv or requirements)"
              exit 1
              ;;
          esac
          echo "Backend SBOM from $SBOM_SOURCE: $(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1])).get("components", [])))' "$BOM") components"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.frontend-directories != ''
        with:
          node-version: ${{ inputs.node-version }}

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: inputs.frontend-directories != ''
        id: syft

      # Per frontend directory: install with the package manager of its lockfile (pnpm and yarn
      # through corepack), then decide what reaches the browser. With frontend-scope bundle, a
      # production build (Vite or webpack) records every npm package that ships: modules in the
      # bundle, Sass partials, assets, and files copied out of node_modules. Without a bundler
      # config, with frontend-scope lockfile, or when the build fails (with a warning), syft reads
      # the lockfile instead. The results go to $WORK/index.tsv for the Frontend SBOM step.
      #
      # As in frontend-tests.yml, the registry settings go in a user-level .npmrc that only exists
      # during the installs and refers to the token as ${...}; it also hides the runner's ~/.npmrc.
      - name: Frontend builds
        if: inputs.frontend-directories != ''
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          SCOPE: ${{ inputs.frontend-scope }}
          WORK: ${{ runner.temp }}/frontends
          GITHUB_PACKAGES: ${{ inputs.github-packages }}
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          case "$SCOPE" in
            bundle|lockfile) ;;
            *) echo "::error::frontend-scope must be bundle or lockfile, got '$SCOPE'"; exit 1 ;;
          esac
          rm -rf "$WORK" && mkdir -p "$WORK/bin"
          corepack enable --install-directory "$WORK/bin" pnpm yarn
          export PATH="$WORK/bin:$PATH"
          root=$PWD

          lockfile_sbom() { # dir lockfile index reason
            echo "$4: using the whole $2"
            "$SYFT" scan "file:$1/$2" -o "cyclonedx-json=$WORK/$3.json" > /dev/null
            printf '%s\tlockfile\t%s\n' "$1" "$WORK/$3.json" >> "$WORK/index.tsv"
          }

          i=0
          for dir in ${FRONTEND_DIRS//,/ }; do
            i=$((i + 1))
            dir=${dir%/}
            echo "::group::$dir"
            if [ ! -f "$dir/package.json" ]; then
              echo "::error::No package.json in frontend directory '$dir'"
              exit 1
            fi
            cd "$root/$dir"
            if [ -f pnpm-lock.yaml ]; then pm=pnpm; lock=pnpm-lock.yaml
            elif [ -f yarn.lock ]; then pm=yarn; lock=yarn.lock
            elif [ -f package-lock.json ]; then pm=npm; lock=package-lock.json
            else
              echo "::error::No pnpm-lock.yaml, yarn.lock or package-lock.json in '$dir'"
              exit 1
            fi
            bundler=
            if compgen -G 'vite.config.*' > /dev/null; then bundler=vite
            elif [ -f webpack.config.js ] || [ -f webpack.config.cjs ]; then bundler=webpack
            fi
            echo "$dir: $pm ($lock), ${bundler:-no bundler config}"

            if [ "$SCOPE" = lockfile ]; then
              cd "$root" && lockfile_sbom "$dir" "$lock" "$i" "frontend-scope lockfile"
              echo "::endgroup::"
              continue
            fi
            if [ -z "$bundler" ]; then
              echo "::warning::No vite.config.* or webpack.config.* in $dir; its whole $lock is scanned"
              cd "$root" && lockfile_sbom "$dir" "$lock" "$i" "no bundler"
              echo "::endgroup::"
              continue
            fi

            : > "$NPM_CONFIG_USERCONFIG"
            # shellcheck disable=SC2016
            if [ "$GITHUB_PACKAGES" = true ]; then
              echo '@OnroerendErfgoed:registry=https://npm.pkg.github.com' >> "$NPM_CONFIG_USERCONFIG"
              echo '//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_TOKEN}' >> "$NPM_CONFIG_USERCONFIG"
            fi
            case "$pm" in
              pnpm) pnpm install --frozen-lockfile ;;
              yarn)
                if yarn --version | grep -q '^1\.'; then yarn install --frozen-lockfile --non-interactive
                else yarn install --immutable; fi
                ;;
              npm) npm ci ;;
            esac
            rm -f "$NPM_CONFIG_USERCONFIG"

            if ! node --input-type=module - "$bundler" > "$WORK/$i.bundled.json" 2> "$WORK/$i.build.log" <<'JS'
          import childProcess from 'node:child_process';
          import fs from 'node:fs';
          import module from 'node:module';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const bundler = process.argv[2];
          const root = process.cwd();
          const req = module.createRequire(path.join(root, 'package.json'));
          const files = new Set();

          // Files copied out of node_modules (vite-plugin-static-copy, copy-webpack-plugin) reach
          // the browser without passing through the bundle: record the source of every copy.
          const record = (src) => {
            const file = path.resolve(src instanceof URL ? src.pathname : String(src));
            if (file.includes(`${path.sep}node_modules${path.sep}`)) files.add(file);
          };
          const wrap = (obj, name, before) => {
            const original = obj[name];
            if (typeof original !== 'function') return;
            obj[name] = function (...args) { return original.apply(this, before(args)); };
          };
          for (const name of ['copyFile', 'copyFileSync', 'cp', 'cpSync', 'createReadStream']) {
            wrap(fs, name, (args) => { record(args[0]); return args; });
          }
          for (const name of ['copyFile', 'cp']) wrap(fs.promises, name, (args) => { record(args[0]); return args; });
          // A CI build must not open a browser (e.g. rollup-plugin-visualizer with open: true).
          wrap(childProcess, 'spawn', (args) => (/(^|\/)(xdg-open|open)$/.test(args[0]) ? ['true', [], {}] : args));
          module.syncBuiltinESMExports();

          if (bundler === 'vite') {
            const { build } = await import(pathToFileURL(req.resolve('vite')).href);
            // Sass and Less partials imported from node_modules never become modules: the CSS
            // plugin only registers them with addWatchFile. Wrap every plugin's transform hook to
            // see those calls.
            const watching = (ctx) => new Proxy(ctx, {
              get(target, key) {
                if (key === 'addWatchFile') return (file) => { files.add(file); return target.addWatchFile(file); };
                const value = Reflect.get(target, key);
                return typeof value === 'function' ? value.bind(target) : value;
              },
            });
            const collect = {
              name: 'dependency-track-collect',
              enforce: 'post',
              configResolved(config) {
                for (const plugin of config.plugins) {
                  const hook = plugin.transform;
                  if (typeof hook === 'function') {
                    plugin.transform = function (...args) { return hook.apply(watching(this), args); };
                  } else if (hook && typeof hook.handler === 'function') {
                    const { handler } = hook;
                    hook.handler = function (...args) { return handler.apply(watching(this), args); };
                  }
                }
              },
              generateBundle(_, bundle) {
                for (const out of Object.values(bundle)) {
                  if (out.type === 'chunk') Object.keys(out.modules).forEach((id) => files.add(id));
                  else (out.originalFileNames || []).forEach((f) => files.add(path.resolve(root, f)));
                }
              },
            };
            await build({ root, mode: 'production', logLevel: 'warn', plugins: [collect] });
          } else {
            const webpack = req('webpack');
            const configFile = fs.existsSync('webpack.config.js') ? 'webpack.config.js' : 'webpack.config.cjs';
            let config = req(path.join(root, configFile));
            if (typeof config === 'function') config = config({ production: true }, {});
            const stats = await new Promise((resolve, reject) => webpack(config, (err, s) => (err ? reject(err) : resolve(s))));
            if (stats.hasErrors()) throw new Error(stats.toString('errors-only'));
            const json = stats.toJson({ all: false, modules: true, nestedModules: true, assets: true, cachedAssets: true });
            const walk = (mods) => (mods || []).forEach((m) => {
              if (m.nameForCondition) files.add(m.nameForCondition);
              walk(m.modules);
            });
            walk(json.modules);
            (json.assets || []).forEach((a) => a.info && a.info.sourceFilename && files.add(path.resolve(a.info.sourceFilename)));
          }

          const pkgs = new Map();
          for (const raw of files) {
            const f = raw.replace(/^\0/, '').replace(/[?#].*$/, '');
            const m = f.match(/^(.*[\\/]node_modules[\\/](?:@[^\\/]+[\\/])?[^\\/]+)[\\/]/);
            if (!m) continue;
            try {
              const { name, version } = JSON.parse(fs.readFileSync(path.join(fs.realpathSync(m[1]), 'package.json')));
              if (name && version) pkgs.set(`${name}@${version}`, { name, version });
            } catch { /* not a package root */ }
          }
          process.stdout.write(JSON.stringify([...pkgs.values()]));
          process.exit(0);
          JS
            then
              tail -n 30 "$WORK/$i.build.log"
              echo "::warning::The $bundler build of $dir failed; its whole $lock is scanned"
              cd "$root" && lockfile_sbom "$dir" "$lock" "$i" "build failed"
            elif [ "$(node -p "JSON.parse(require('fs').readFileSync('$WORK/$i.bundled.json', 'utf8')).length")" = 0 ]; then
              # No bundled packages means the scoping went wrong, not that nothing ships.
              echo "::warning::The $bundler build of $dir shipped no npm packages; its whole $lock is scanned"
              cd "$root" && lockfile_sbom "$dir" "$lock" "$i" "nothing bundled"
            else
              printf '%s\tbundle\t%s\n' "$dir" "$WORK/$i.bundled.json" >> "$WORK/index.tsv"
            fi
            cd "$root"
            echo "::endgroup::"
          done

      # One CycloneDX SBOM for all frontends: the packages each build shipped, or the npm
      # components syft found in the lockfile.
      - name: Frontend SBOM
        id: frontend-sbom
        if: inputs.frontend-directories != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORK: ${{ runner.temp }}/frontends
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const purlOf = (name, version) => `pkg:npm/${name.replace(/^@/, '%40')}@${encodeURIComponent(version)}`;
            // pkg:npm/%40scope/name@1.0.0 -> { name: '@scope/name', version: '1.0.0' }
            const fromPurl = (purl) => {
              const m = (purl || '').match(/^pkg:npm\/((?:%40|@)[^/@?#]+\/)?([^/@?#]+)@([^?#]+)/);
              return m && { name: `${(m[1] || '').replace(/^%40/, '@')}${decodeURIComponent(m[2])}`, version: decodeURIComponent(m[3]) };
            };

            const components = new Map();
            const lines = fs.readFileSync(`${process.env.WORK}/index.tsv`, 'utf8').split('\n').filter(Boolean);
            for (const line of lines) {
              const [dir, source, file] = line.split('\t');
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const packages = source === 'bundle'
                ? data
                : (data.components || []).map((c) => fromPurl(c.purl)).filter(Boolean);
              for (const { name, version } of packages) {
                const purl = purlOf(name, version);
                components.set(purl, { type: 'library', 'bom-ref': purl, name, version, purl });
              }
              console.log(`${dir}: ${packages.length} packages (${source === 'bundle' ? 'production build' : 'whole lockfile'})`);
            }

            const project = process.env.PROJECT;
            const bom = {
              bomFormat: 'CycloneDX',
              specVersion: '1.5',
              serialNumber: `urn:uuid:${crypto.randomUUID()}`,
              version: 1,
              metadata: {
                timestamp: new Date().toISOString(),
                component: { type: 'application', name: `${project}-frontend`, version: process.env.VERSION },
              },
              components: [...components.values()].sort((a, b) => a.purl.localeCompare(b.purl)),
            };
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/frontend.bom.json`, JSON.stringify(bom));
            console.log(`Frontend SBOM: ${bom.components.length} components`);

      - name: Dependency-Track session
        env:
          PROVIDER: ${{ inputs.workload-identity-provider }}
          SERVICE_ACCOUNT: ${{ inputs.service-account }}
        run: |
          audience=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DT_URL"], safe=""))')
          id_token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')
          response=$(curl -sS -w '\n%{http_code}' "$DT_URL/api/v2/oauth/token" \
            --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            --data-urlencode subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            --data-urlencode "subject_token=$id_token" \
            --data-urlencode "workload_identity_provider=$PROVIDER" \
            --data-urlencode "service_account=$SERVICE_ACCOUNT")
          if [ "$(tail -n1 <<< "$response")" != 200 ]; then
            echo "::error::Token exchange at $DT_URL failed: $(sed '$d' <<< "$response")"
            echo "Check the workload identity provider '$PROVIDER' (audience $DT_URL) and a binding on '$SERVICE_ACCOUNT' for this repository."
            exit 1
          fi
          token=$(sed '$d' <<< "$response" | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$token"
          echo "DT_TOKEN=$token" >> "$GITHUB_ENV"

      # Creates the parent project if needed, uploads the SBOMs as its children, waits for the
      # analysis and saves every finding to $RUNNER_TEMP/dt-findings.json for the score step.
      - name: Upload and analyse
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_LATEST: ${{ steps.version.outputs.latest }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, uuid
          import urllib.error, urllib.parse, urllib.request

          dt, token = os.environ["DT_URL"], os.environ["DT_TOKEN"]
          project, version = os.environ["PROJECT"], os.environ["VERSION"]
          is_latest = os.environ["IS_LATEST"] == "true"
          temp = os.environ["RUNNER_TEMP"]

          def call(method, path, body=None, content_type="application/json", headers=False):
              req = urllib.request.Request(dt + "/api" + path, data=body, method=method,
                                           headers={"Authorization": f"Bearer {token}", "Content-Type": content_type})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      data = r.read()
                      parsed = json.loads(data) if data else None
                      return (parsed, r.headers) if headers else parsed
              except urllib.error.HTTPError as e:
                  if e.code == 404 and method == "GET":
                      return (None, e.headers) if headers else None
                  hint = (" (the service account needs BOM_UPLOAD, PROJECT_CREATION_UPLOAD, VIEW_PORTFOLIO,"
                          " VIEW_VULNERABILITY and PORTFOLIO_MANAGEMENT_CREATE)") if e.code == 403 else ""
                  sys.exit(f"::error::{method} {path}: HTTP {e.code} {e.read().decode()[:300]}{hint}")

          def lookup(name):
              q = urllib.parse.urlencode({"name": name, "version": version})
              return call("GET", f"/v1/project/lookup?{q}")

          parent = lookup(project)
          if not parent:
              print(f"Creating project {project} {version}")
              parent = call("PUT", "/v1/project", json.dumps(
                  {"name": project, "version": version, "classifier": "APPLICATION", "isLatest": is_latest}).encode())

          def upload(name, bom_file):
              fields = {"projectName": name, "projectVersion": version, "parentName": project,
                        "parentVersion": version, "autoCreate": "true", "isLatest": str(is_latest).lower()}
              boundary = uuid.uuid4().hex
              body = b"".join(
                  f'--{boundary}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n'.encode()
                  for k, v in fields.items())
              body += (f'--{boundary}\r\nContent-Disposition: form-data; name="bom"; filename="bom.json"\r\n'
                       f"Content-Type: application/json\r\n\r\n").encode()
              body += open(bom_file, "rb").read() + f"\r\n--{boundary}--\r\n".encode()
              return call("POST", "/v1/bom", body, f"multipart/form-data; boundary={boundary}")["token"]

          parts = [("backend", f"{temp}/backend.bom.json")]
          if os.path.exists(f"{temp}/frontend.bom.json"):
              parts.append(("frontend", f"{temp}/frontend.bom.json"))
          tokens = {label: upload(f"{project}-{label}", f) for label, f in parts}

          deadline = time.time() + 15 * 60
          for label, t in tokens.items():
              while (call("GET", f"/v1/bom/token/{t}") or {}).get("processing", False):
                  if time.time() > deadline:
                      sys.exit(f"::error::Dependency-Track did not finish analysing the {label} SBOM in 15 minutes")
                  time.sleep(5)
              print(f"{label}: analysed")

          projects = []
          for label, _ in parts:
              p = lookup(f"{project}-{label}")
              findings, page = [], 1
              while True:
                  chunk, headers = call("GET", f"/v1/finding/project/{p['uuid']}?pageSize=100&pageNumber={page}", headers=True)
                  findings += chunk or []
                  if not chunk or len(findings) >= int(headers.get("X-Total-Count") or 0):
                      break
                  page += 1
              projects.append({"label": label, "name": p["name"], "version": version,
                               "url": f"{dt}/projects/{p['uuid']}", "findings": findings})
              print(f"{label}: {len(findings)} findings")
          json.dump({"parentUrl": f"{dt}/projects/{parent['uuid']}", "projects": projects},
                    open(f"{temp}/dt-findings.json", "w"))
          PY

      - name: Risk score
        id: score
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ICR_B: ${{ inputs.icr-b }}
          ICR_I: ${{ inputs.icr-i }}
          ICR_C: ${{ inputs.icr-c }}
          EXPOSURE: ${{ inputs.exposure }}
          EPSS_THRESHOLD: ${{ inputs.epss-threshold }}
        with:
          script: |
            const fs = require('fs');
            const temp = process.env.RUNNER_TEMP;

            const int = (name, max) => {
              const value = Number(process.env[name]);
              if (!Number.isInteger(value) || value < 1 || value > max) {
                throw new Error(`${name} must be an integer 1-${max}, got '${process.env[name]}'`);
              }
              return value;
            };
            const impact = Math.max(int('ICR_B', 5), int('ICR_I', 5), int('ICR_C', 5));
            const exposure = int('EXPOSURE', 3);
            const epssThreshold = Number(process.env.EPSS_THRESHOLD);

            // The same issue often comes back once per source: GHSA-... (GitHub), PYSEC-... (OSV)
            // and CVE-... (NVD). Group each finding under one key per component:
            //   GITHUB -> its GHSA id
            //   OSV    -> the single GHSA it references, else its single CVE mapped to a GHSA
            //   NVD    -> its CVE mapped to a GHSA
            // and fall back to the finding's own id. A record that references several GHSAs/CVEs
            // is left alone rather than merged on a guess.
            const merge = (findings) => {
              const comp = (f) => `${f.component.name}@${f.component.version ?? '?'}`;
              const uniqOrNull = (xs) => { const u = [...new Set(xs)]; return u.length === 1 ? u[0] : null; };
              const refd = (f, re) => `${f.vulnerability.references ?? ''} ${f.vulnerability.description ?? ''}`.match(re) ?? [];
              const cve2ghsa = {};
              for (const f of findings.filter((x) => x.vulnerability.source === 'GITHUB')) {
                for (const a of f.vulnerability.aliases ?? []) {
                  if (a.cveId) cve2ghsa[`${comp(f)} ${a.cveId}`] = f.vulnerability.vulnId;
                }
              }
              const groups = new Map();
              for (const f of findings) {
                const v = f.vulnerability;
                let key = null;
                if (v.source === 'GITHUB') key = v.vulnId;
                else if (v.source === 'OSV') {
                  key = uniqOrNull(refd(f, /GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}/g));
                  if (!key) {
                    const cve = uniqOrNull(refd(f, /CVE-[0-9]{4}-[0-9]+/g));
                    key = cve ? cve2ghsa[`${comp(f)} ${cve}`] ?? null : null;
                  }
                } else if (v.vulnId.startsWith('CVE-')) key = cve2ghsa[`${comp(f)} ${v.vulnId}`] ?? null;
                const id = `${comp(f)}\n${key ?? v.vulnId}`;
                if (!groups.has(id)) groups.set(id, []);
                groups.get(id).push(f);
              }
              const category = (id) => (id.startsWith('GHSA') ? 0 : id.startsWith('CVE') ? 1 : 2);
              const numbers = (xs) => xs.filter((x) => typeof x === 'number');
              return [...groups.values()].map((group) => {
                const worst = group.reduce((a, b) => ((b.vulnerability.severityRank ?? 9) < (a.vulnerability.severityRank ?? 9) ? b : a));
                const cvss = numbers(group.map((f) => f.vulnerability.cvssV4Score ?? f.vulnerability.cvssV3BaseScore));
                const epss = numbers(group.map((f) => f.vulnerability.epssScore));
                const { component } = group[0];
                return {
                  component: comp(group[0]),
                  name: component.name,
                  version: component.version ?? null,
                  purl: component.purl ?? null,
                  latestVersion: component.latestVersion ?? null,
                  severity: worst.vulnerability.severity ?? null,
                  rank: worst.vulnerability.severityRank ?? 9,
                  cvss: cvss.length ? Math.max(...cvss) : null,
                  kev: group.some((f) => f.vulnerability.isKev === true),
                  epss: epss.length ? Math.max(...epss) : null,
                  ids: [...new Set(group.map((f) => f.vulnerability.vulnId))].sort()
                    .sort((a, b) => category(a) - category(b)),
                  sources: [...new Set(group.map((f) => f.vulnerability.source))].sort(),
                };
              });
            };

            // CVSS weight: <4.0 -> 1, 4.0-6.9 -> 2, 7.0-8.9 -> 3, >=9.0 -> 4 (v4 base score, else v3;
            // without a score the severity, and 4 when that is unknown too).
            // Exploitability: CISA KEV -> 3, EPSS >= epss-threshold -> 2, else 1.
            const score = (f) => {
              const wCvss = f.cvss === null
                ? ({ CRITICAL: 4, HIGH: 3, MEDIUM: 2, LOW: 1 }[f.severity] ?? 4)
                : f.cvss >= 9 ? 4 : f.cvss >= 7 ? 3 : f.cvss >= 4 ? 2 : 1;
              const wExpl = f.kev ? 3 : (f.epss ?? 0) >= epssThreshold ? 2 : 1;
              const risk = impact * (wCvss + wExpl + exposure);
              const level = risk >= 36 ? 'Kritiek' : risk >= 21 ? 'Hoog' : 'Laag-middel';
              return { ...f, wCvss, wExpl, risk, level };
            };

            const input = JSON.parse(fs.readFileSync(`${temp}/dt-findings.json`, 'utf8'));
            const findings = input.projects.flatMap((p) => merge(p.findings).map((f) => score({ ...f, project: p.label })))
              .sort((a, b) => b.risk - a.risk || a.component.localeCompare(b.component) || a.rank - b.rank);
            fs.writeFileSync(`${temp}/dt-scored.json`, JSON.stringify({ ...input, impact, exposure, findings }));

            const count = (level) => findings.filter((f) => f.level === level).length;
            const maxRisk = findings.length ? findings[0].risk : 0;
            core.setOutput('max-risk', String(maxRisk));
            core.setOutput('max-level', findings.length ? findings[0].level : 'none');

            const advisory = (f) => f.ids.join(' = ');
            const exploit = (f) => [f.kev ? 'KEV' : null, f.epss !== null ? `EPSS ${Math.round(f.epss * 1000) / 1000}` : null]
              .filter(Boolean).join(', ');
            const lines = [
              `### Dependency-Track: ${findings.length} findings`,
              '',
              `Risicoscore = Impact ${impact} (max of ICR B/I/C) × (CVSS weight + exploitability + exposure ${exposure}); ` +
                'CVSS weight <4.0: 1, 4.0-6.9: 2, 7.0-8.9: 3, >=9.0: 4; exploitability KEV: 3, ' +
                `EPSS >= ${epssThreshold}: 2, else 1.`,
              '',
              `Kritiek: ${count('Kritiek')}, Hoog: ${count('Hoog')}, Laag-middel: ${count('Laag-middel')}. ` +
                `[Open in Dependency-Track](${input.parentUrl})`,
            ];
            if (findings.length) {
              lines.push('', '| Risk | Calculation | Level | Component | Advisory | CVSS | Exploitability | Project |',
                '| ---: | --- | --- | --- | --- | ---: | --- | --- |');
              for (const f of findings) {
                lines.push(`| ${f.risk} | ${impact} × (${f.wCvss} + ${f.wExpl} + ${exposure}) | ${f.level} | \`${f.component}\` ` +
                  `| ${advisory(f)} | ${f.cvss ?? f.severity ?? '?'} | ${exploit(f) || '-'} | ${f.project} |`);
              }
            }
            await core.summary.addRaw(lines.join('\n')).write();
            console.log(`Max risk ${maxRisk} (${findings.length ? findings[0].level : 'no findings'})`);

      - name: Issues
        id: issues
        if: inputs.ticket-level != 'none'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TICKET_LEVEL: ${{ inputs.ticket-level }}
          TICKET_LABELS: ${{ inputs.ticket-labels }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
          IS_PR: ${{ github.event_name == 'pull_request' }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const levels = ['Laag-middel', 'Hoog', 'Kritiek'];
            const minimum = levels.indexOf(process.env.TICKET_LEVEL);
            if (minimum < 0) throw new Error(`ticket-level must be Kritiek, Hoog, Laag-middel or none, got '${process.env.TICKET_LEVEL}'`);
            const labels = process.env.TICKET_LABELS.split(',').map((l) => l.trim()).filter(Boolean);
            const isPr = process.env.IS_PR === 'true';

            const scored = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/dt-scored.json`, 'utf8'));
            const relevant = scored.findings.filter((f) => levels.indexOf(f.level) >= minimum);

            // One issue per library (package URL without version), whatever versions or projects it
            // shows up in. A hidden marker in the body finds the issue again on later runs.
            const libraryOf = (f) => (f.purl ? f.purl.replace(/[@?#].*$/, '') : f.name);
            const libraries = new Map();
            for (const f of relevant) {
              const key = libraryOf(f);
              if (!libraries.has(key)) libraries.set(key, []);
              libraries.get(key).push(f);
            }
            const markerOf = (key) => `<!-- dependency-track-library: ${key} -->`;

            const link = (id) => {
              if (id.startsWith('GHSA-')) return `[${id}](https://github.com/advisories/${id})`;
              if (id.startsWith('CVE-')) return `[${id}](https://nvd.nist.gov/vuln/detail/${id})`;
              return `[${id}](https://osv.dev/vulnerability/${id})`;
            };
            const body = (key, items) => {
              const name = items[0].name;
              const inUse = [...new Map(items.map((f) => [`${f.version} ${f.project}`, f])).values()];
              const lines = [
                markerOf(key),
                `**\`${name}\`** has known vulnerabilities in the version(s) in use. Update it to a version ` +
                  'that fixes all advisories below; each advisory lists its fixed versions.',
                '',
                '| Version in use | Project | Latest known version |',
                '| --- | --- | --- |',
                ...inUse.map((f) => `| ${f.version ?? '?'} | ${f.project} | ${f.latestVersion ?? '?'} |`),
                '',
                '| Risk | Level | Advisory | CVSS | Exploitability |',
                '| ---: | --- | --- | ---: | --- |',
              ];
              const seen = new Set();
              for (const f of items) {
                const id = f.ids.join(' ');
                if (seen.has(id)) continue;
                seen.add(id);
                const exploit = [f.kev ? 'KEV' : null, f.epss !== null ? `EPSS ${Math.round(f.epss * 1000) / 1000}` : null]
                  .filter(Boolean).join(', ');
                lines.push(`| ${f.risk} | ${f.level} | ${f.ids.map(link).join(' = ')} | ${f.cvss ?? f.severity ?? '?'} | ${exploit || '-'} |`);
              }
              lines.push('', `Risicoscore = Impact ${scored.impact} x (CVSS weight + exploitability + exposure ${scored.exposure}). ` +
                `Last seen by [this run](${process.env.RUN_URL}) on ${process.env.REF_NAME}; ` +
                `see [Dependency-Track](${scored.parentUrl}). This description is updated on every run.`);
              return lines.join('\n');
            };

            // Besides ticket-labels, each issue is labelled with the project(s) the library is in
            // (backend, frontend). Labels are only added to existing issues, never removed, so
            // labels set by hand stay.
            const projectsOf = (items) => [...new Set(items.map((f) => f.project))].sort();
            const colors = { security: 'd73a4a', backend: '1d76db', frontend: '5319e7' };
            for (const label of [...labels, ...projectsOf(relevant)]) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name: label, color: colors[label] ?? 'ededed' });
              } catch (e) {
                if (e.status !== 422) throw e; // 422: the label exists
              }
            }
            const existing = labels.length
              ? await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', labels: labels[0], per_page: 100 })
              : [];
            const addMissingLabels = async (issue, wanted) => {
              const have = new Set((issue.labels ?? []).map((l) => (typeof l === 'string' ? l : l.name)));
              const missing = wanted.filter((l) => !have.has(l));
              if (missing.length) await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: missing });
            };

            const created = [], updated = [], reopened = [], skipped = [];
            for (const [key, items] of libraries) {
              const count = new Set(items.map((f) => f.ids.join(' '))).size;
              const title = `Update ${items[0].name} (${items[0].level}: ${count} ${count === 1 ? 'advisory' : 'advisories'})`;
              const text = body(key, items);
              const issueLabels = [...labels, ...projectsOf(items)];
              const matches = existing.filter((i) => !i.pull_request && (i.body ?? '').includes(markerOf(key)));
              const open = matches.find((i) => i.state === 'open');
              if (open) {
                if (open.body !== text || open.title !== title) {
                  await github.rest.issues.update({ owner, repo, issue_number: open.number, title, body: text });
                }
                await addMissingLabels(open, issueLabels);
                updated.push(open.number);
                continue;
              }
              const closed = matches.sort((a, b) => b.number - a.number)[0];
              if (closed && (closed.state_reason === 'not_planned' || isPr)) {
                // Closed as not planned: a decision to accept the risk. On PRs, a closed issue may
                // have been fixed on the default branch already; the nightly run reopens it if not.
                skipped.push(closed.number);
                continue;
              }
              if (closed) {
                await github.rest.issues.update({ owner, repo, issue_number: closed.number, state: 'open', title, body: text });
                await addMissingLabels(closed, issueLabels);
                await github.rest.issues.createComment({ owner, repo, issue_number: closed.number,
                  body: `Reopened: still vulnerable on ${process.env.REF_NAME} ([run](${process.env.RUN_URL})).` });
                reopened.push(closed.number);
                continue;
              }
              const { data } = await github.rest.issues.create({ owner, repo, title, body: text, labels: issueLabels });
              created.push(data.number);
            }
            core.setOutput('created', created.join(','));
            core.setOutput('updated', updated.join(','));
            core.setOutput('reopened', reopened.join(','));
            console.log(`Issues: created [${created}], updated [${updated}], reopened [${reopened}], ` +
              `left closed [${skipped}]`);

      # Not on pull requests: those fail the PR, which is alert enough. One Sentry issue per
      # repository (the fingerprint); every run that fails adds an event to it.
      - name: Sentry alert
        id: sentry
        if: ${{ !cancelled() && steps.score.outcome == 'success' && github.event_name != 'pull_request' && inputs.fail-level != 'none' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SENTRY_DSN: ${{ secrets.sentry-dsn }}
          FAIL_LEVEL: ${{ inputs.fail-level }}
          TICKET_LABELS: ${{ inputs.ticket-labels }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const temp = process.env.RUNNER_TEMP;
            core.setOutput('send', 'false');

            const levels = ['Laag-middel', 'Hoog', 'Kritiek'];
            const minimum = levels.indexOf(process.env.FAIL_LEVEL);
            if (minimum < 1) return; // an invalid fail-level is reported by Check fail level
            const scored = JSON.parse(fs.readFileSync(`${temp}/dt-scored.json`, 'utf8'));
            const alerts = scored.findings.filter((f) => levels.indexOf(f.level) >= minimum);
            if (!alerts.length) return;
            if (!process.env.SENTRY_DSN) {
              core.info('No sentry-dsn secret: no Sentry alert');
              return;
            }

            // DSN https://<public key>@<host>[/<path>]/<project id> -> the project's envelope endpoint.
            let dsn;
            try {
              dsn = new URL(process.env.SENTRY_DSN);
            } catch {
              throw new Error('sentry-dsn is not a URL');
            }
            const path = dsn.pathname.match(/^(.*)\/(\d+)\/?$/);
            if (!dsn.username || !path) throw new Error('sentry-dsn must look like https://<key>@<host>/<project id>');
            core.setSecret(dsn.username);
            const endpoint = `${dsn.protocol}//${dsn.host}${path[1]}/api/${path[2]}/envelope/` +
              `?sentry_key=${dsn.username}&sentry_version=7`;

            const libraryOf = (f) => (f.purl ? f.purl.replace(/[@?#].*$/, '') : f.name);
            const libraries = new Set(alerts.map(libraryOf)).size;
            const top = alerts[0];
            const label = process.env.TICKET_LABELS.split(',').map((l) => l.trim()).find(Boolean);
            const issues = `${process.env.REPO_URL}/issues` +
              (label ? `?q=${encodeURIComponent(`is:issue is:open label:${label}`)}` : '');
            const eventId = crypto.randomUUID().replace(/-/g, '');
            const event = {
              event_id: eventId,
              timestamp: Date.now() / 1000,
              platform: 'other',
              logger: 'dependency-track',
              level: top.level === 'Kritiek' ? 'fatal' : 'error',
              message: {
                formatted: `${process.env.REPOSITORY}: ${top.level}, Risicoscore ${top.risk} ` +
                  `(${alerts.length} ${alerts.length === 1 ? 'finding' : 'findings'} in ` +
                  `${libraries} ${libraries === 1 ? 'library' : 'libraries'})`,
              },
              fingerprint: ['dependency-track', process.env.REPOSITORY],
              environment: process.env.REF_NAME,
              release: process.env.VERSION,
              tags: {
                repository: process.env.REPOSITORY,
                max_level: top.level,
                max_risk: String(top.risk),
                tier: [...new Set(alerts.map((f) => f.project))].sort().join(','),
              },
              contexts: {
                dependency_track: {
                  type: 'default',
                  max_risk: top.risk,
                  fail_level: process.env.FAIL_LEVEL,
                  impact: scored.impact,
                  exposure: scored.exposure,
                  run: process.env.RUN_URL,
                  issues,
                  dependency_track: scored.parentUrl,
                },
              },
              extra: {
                findings: alerts.map((f) => `${f.risk} ${f.level} ${f.component} ${f.ids.join(' = ')} (${f.project})`),
              },
            };
            const envelope = [
              { event_id: eventId, sent_at: new Date().toISOString() },
              { type: 'event' },
              event,
            ].map((part) => JSON.stringify(part)).join('\n');
            fs.writeFileSync(`${temp}/sentry.envelope`, `${envelope}\n`);
            fs.writeFileSync(`${temp}/sentry.url`, endpoint);
            core.setOutput('send', 'true');
            console.log(`Sentry alert: ${event.message.formatted}`);

      # A failed send does not fail the step: the job fails on fail-level right after anyway.
      - name: Send to Sentry
        if: ${{ !cancelled() && steps.sentry.outputs.send == 'true' }}
        run: |
          if response=$(curl -sS --fail-with-body --max-time 30 \
            -H 'Content-Type: application/x-sentry-envelope' \
            --data-binary "@$RUNNER_TEMP/sentry.envelope" \
            --url "$(cat "$RUNNER_TEMP/sentry.url")" 2>&1); then
            echo "Sent to Sentry: $response"
          else
            echo "::error::Sending the alert to Sentry failed: $response"
          fi

      - name: Check fail level
        env:
          FAIL_LEVEL: ${{ inputs.fail-level }}
          MAX_LEVEL: ${{ steps.score.outputs.max-level }}
          MAX_RISK: ${{ steps.score.outputs.max-risk }}
        run: |
          rank() { case "$1" in Kritiek) echo 3 ;; Hoog) echo 2 ;; Laag-middel) echo 1 ;; *) echo 0 ;; esac; }
          case "$FAIL_LEVEL" in
            none) exit 0 ;;
            Kritiek|Hoog) ;;
            *) echo "::error::fail-level must be Kritiek, Hoog or none, got '$FAIL_LEVEL'"; exit 1 ;;
          esac
          if [ "$(rank "$MAX_LEVEL")" -ge "$(rank "$FAIL_LEVEL")" ]; then
            echo "::error::Highest Risicoscore $MAX_RISK is $MAX_LEVEL (fail-level $FAIL_LEVEL); see the job summary and the issues"
            exit 1
          fi
          echo "Highest level: $MAX_LEVEL (fail-level $FAIL_LEVEL)"
