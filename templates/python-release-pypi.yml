# Caller for the shared Python release, publishing to public PyPI. Copy to .github/workflows/
# in a public library repo.
#
# When the draft release x.y.z (from release-draft.yml) is published, the sdist and wheel are
# built by the shared workflow and published to PyPI with trusted publishing (no token stored).
# The publish job has to be in this file: PyPI doesn't accept trusted publishing from a
# reusable workflow.
#
# On pypi.org, add a trusted publisher for this repository with this workflow's file name
# and the environment `pypi`, and create the `pypi` environment in the repository settings.
name: Python release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/python-release.yml@v1
    permissions:
      contents: read
    with:
      runs-on: ubuntu-latest
      python-version: "3.11"
      upload: false # the publish job below uploads

  publish:
    needs: build
    # Only releases (tags), not a manual run on a branch.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
