# Caller for the shared changelog and release drafts. Copy to .github/workflows/ in a project repo.
#
# - A PR into main/master titled "release x.y.z" gets the version bumped and a changelog section
#   (grouped by 💥 Breaking changes / 🐛 Bugs / ✨ Features / 🧹 Other) committed to its branch.
# - When that PR is merged, a draft GitHub release x.y.z is created from the changelog section.
name: Release

on:
  pull_request:
    types: [opened, reopened, edited, closed]
    branches: [main, master]

permissions: {}

jobs:
  changelog-draft:
    if: github.event.action != 'closed'
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/changelog-draft.yml@v1
    permissions:
      contents: write
      issues: read
      pull-requests: write
    secrets: inherit # passes RELEASE_TOKEN when the repo or org has one
    # with:
    #   changelog-path: proces/CHANGES.rst # only when there are several changelogs

  release-draft:
    if: github.event.action == 'closed' && github.event.pull_request.merged
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/release-draft.yml@v1
    permissions:
      contents: write
