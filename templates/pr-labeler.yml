# Caller for the shared PR labeler. Copy to .github/workflows/ in a project repo,
# next to the labeler configuration in .github/pr-labeler.yml.
name: PR Labeler

on:
  pull_request:
    types: [opened]
    branches: [develop, epic]

permissions: {}

jobs:
  pr-labeler:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/pr-labeler.yml@v1
    permissions:
      contents: read
      pull-requests: write
