# Caller for the shared Dependency-Track scan. Copy to .github/workflows/ in a project repo
# and fill in the app's ICR3.0 classification and exposure.
#
# Dependency-Track keeps one version of the app per environment (dev, test, prod) with the code
# deployed there:
# - the deploy tool runs this workflow with environment and ref, which records the deployment
#   and scans it:  gh workflow run dependency-track.yml -f environment=prod -f ref=2.14.0
# - every night, the deployment recorded for each environment is scanned again;
# - every PR to main/master is scanned in a throwaway version.
# Every finding gets a Risicoscore. PRs and prod get one GitHub issue per library with Hoog or
# Kritiek findings; a finding at fail-level fails the job and, outside PRs, alerts Sentry.
#
# Keep this file on the default branch: the deploy and the nightly run start there and check out
# the deployed commit themselves, so older tags without this file can be scanned too.
name: Dependency-Track

on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '17 3 * * *' # nightly: the deployment recorded for each environment
  workflow_dispatch:
    inputs:
      environment:
        description: Environment just deployed to (dev, test or prod); empty scans every environment
        type: string
        default: ""
      ref:
        description: Branch, tag or commit deployed; empty rescans the recorded deployment
        type: string
        default: ""

permissions: {}

jobs:
  dependency-track:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/dependency-track.yml@v2
    permissions:
      contents: read
      id-token: write
      issues: write
      packages: read
      pull-requests: read
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      icr-b: 3 # ICR3.0 Beschikbaarheid 1-5
      icr-i: 3 # ICR3.0 Integriteit 1-5
      icr-c: 3 # ICR3.0 Confidentialiteit 1-5
      exposure: 3 # 1 = internal and isolated, 2 = reachable internally, 3 = reachable from outside
      # fail-level: Hoog # default Kritiek; none to never fail
      # frontend-directories: frontend # Vue (vite.config.*) or Aurelia (webpack.config.*); several: "frontend legacy/apps"
      # backend-directory: backend # when pyproject.toml / uv.lock is not at the root
    secrets:
      sentry-dsn: ${{ secrets.DEPENDENCY_TRACK_SENTRY_DSN }} # organization secret
