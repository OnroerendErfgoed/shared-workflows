# Caller for the shared changelog draft. Copy to .github/workflows/ in a project repo.
#
# When a PR from develop into main/master titled "release x.y.z" is opened (or its title is
# edited), the version is bumped and a changelog section, grouped by 💥 Breaking changes /
# 🐛 Bugs / ✨ Features / 🧹 Other, is committed to the PR branch.
name: Changelog draft

on:
  pull_request:
    types: [opened, reopened, edited]
    branches: [main, master]

permissions: {}

jobs:
  changelog-draft:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/changelog-draft.yml@v1
    permissions:
      contents: write
      issues: read
      pull-requests: write
    secrets: inherit # passes RELEASE_TOKEN when the repo or org has one
    # with:
    #   changelog-path: proces/CHANGES.rst # only when there are several changelogs
